<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>능률VOCA · 학습 관리</title>
<style>
  :root{
    --ink:#1c2733;--ink-soft:#5a6b7b;--paper:#f6f4ee;--card:#ffffff;--line:#dfe4ea;
    --accent:#2f6f5e;--accent-soft:#e3efe9;--gold:#c08a2d;--wrong:#c0492f;--wrong-soft:#f7e6e1;
    --shadow:0 6px 24px rgba(28,39,51,.08);--r:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:920px;margin:0 auto;padding:24px 18px 80px}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  .hidden{display:none !important}

  header.top{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
  .brand{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .tools{margin-left:auto;display:flex;gap:10px;align-items:center}
  .tools button{font-size:13px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px}
  .tools button:hover{color:var(--accent)}

  h1.title{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
  .subtitle{color:var(--ink-soft);font-size:15px;margin-bottom:22px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}

  /* gate */
  .gate-wrap{max-width:380px;margin:40px auto 0}
  .fld{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
  .fld span{font-size:13px;font-weight:700;color:var(--ink-soft)}
  .fld input{border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:18px;
    background:var(--paper);transition:.15s;width:100%;text-align:center;letter-spacing:.3em}
  .fld input:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
  .go{width:100%;background:var(--accent);color:#fff;border-radius:12px;padding:15px;font-weight:800;font-size:16px}
  .go:hover{background:#27604f}
  .gate-msg{font-size:13px;text-align:center;color:var(--wrong);font-weight:600;min-height:18px;margin-top:10px}

  /* stats row */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  @media(max-width:560px){.stats{grid-template-columns:1fr}}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
  .stat .n{font-size:28px;font-weight:800;color:var(--accent)}
  .stat .l{font-size:13px;color:var(--ink-soft)}

  .bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .search{flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:14px;background:var(--paper)}
  .search:focus{outline:none;border-color:var(--accent);background:#fff}
  .refresh{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 16px;font-weight:700;font-size:14px}
  .refresh:hover{border-color:var(--accent);background:var(--accent-soft)}

  /* student list */
  .srow{display:flex;align-items:center;gap:14px;padding:15px 10px;border-bottom:1px solid var(--line);width:100%;text-align:left;transition:.12s}
  .srow:last-child{border-bottom:none}
  .srow:hover{background:var(--accent-soft)}
  .srow .nm{font-size:17px;font-weight:700;min-width:110px}
  .srow .kk{font-size:12px;color:var(--ink-soft);font-family:ui-monospace,monospace}
  .srow .pills{margin-left:auto;display:flex;gap:8px;flex:none}
  .pill{font-size:12px;font-weight:700;border-radius:99px;padding:4px 11px}
  .pill.fav{background:#f6edd8;color:var(--gold)}
  .pill.wrong{background:var(--wrong-soft);color:var(--wrong)}
  .pill.zero{background:var(--paper);color:var(--ink-soft);font-weight:400}
  .chev{color:var(--line);font-size:18px;flex:none}

  /* detail */
  .back{font-size:14px;color:var(--accent);text-decoration:underline;cursor:pointer;font-weight:600;margin-bottom:14px;display:inline-block}
  .detail-head{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap}
  .detail-head .dn{font-size:24px;font-weight:800}
  .detail-head .dk{font-size:13px;color:var(--ink-soft);font-family:ui-monospace,monospace}
  .seg{display:flex;gap:8px;margin:18px 0 14px}
  .seg button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:9px 18px;font-weight:700;font-size:14px;color:var(--ink-soft)}
  .seg button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .vrow{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line)}
  .vrow:last-child{border-bottom:none}
  .vrow .vw{font-size:16px;font-weight:700;min-width:110px}
  .vrow .vg{font-size:11px;color:var(--ink-soft);border:1px solid var(--line);border-radius:99px;padding:2px 9px;flex:none}
  .vrow .vm{color:var(--ink-soft);flex:1;font-size:14px}
  /* 주관식 인정 답안 */
  .arow{display:flex;align-items:center;gap:10px;padding:13px 6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .arow:last-child{border-bottom:none}
  .arow .aw{font-size:15px;font-weight:800;min-width:96px}
  .arow .aa{flex:1;min-width:140px;font-size:15px;color:var(--ink)}
  .arow .aa small{color:var(--ink-soft);font-size:12px}
  .tag{font-size:11px;font-weight:700;border-radius:99px;padding:3px 10px;flex:none}
  .tag.self{background:var(--accent-soft);color:var(--accent)}
  .tag.req{background:#f6edd8;color:var(--gold)}
  .tag.glob{background:#e6f0ff;color:#2b5fa8}
  .abtn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:700;flex:none}
  .abtn:hover{border-color:var(--accent);color:var(--accent)}
  .abtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .abtn:disabled{opacity:.5;cursor:default}
  .note{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:12px}
  .empty-state{text-align:center;padding:44px 20px;color:var(--ink-soft)}
  .empty-state .e-ic{font-size:38px;margin-bottom:10px}
  footer{margin-top:30px;text-align:center;font-size:12px;color:var(--ink-soft)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="brand">능률VOCA · 학습 관리</span>
    <div class="tools" id="tools"></div>
  </header>

  <!-- GATE -->
  <section id="screen-gate">
    <div class="gate-wrap">
      <h1 class="title" style="text-align:center">관리자 확인</h1>
      <p class="subtitle" style="text-align:center">관리자 번호를 입력하세요.</p>
      <div class="panel">
        <div class="fld">
          <span style="text-align:center">관리자 번호</span>
          <input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off">
        </div>
        <button class="go" id="gateBtn">들어가기</button>
        <p class="gate-msg" id="gateMsg"></p>
      </div>
    </div>
  </section>

  <!-- LIST -->
  <section id="screen-list" class="hidden">
    <h1 class="title">학생 명단</h1>
    <p class="subtitle">이름을 누르면 그 학생의 즐겨찾기·틀린 단어를 볼 수 있어요.</p>
    <div class="stats" id="stats"></div>
    <div class="panel">
      <div class="bar">
        <input class="search" id="search" placeholder="이름으로 검색">
        <button class="refresh" id="refresh">↻ 새로고침</button>
      </div>
      <div id="studentList"></div>
    </div>

    <div class="panel" id="aiPanel" style="margin-top:16px">
      <div class="list-head" style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <h2 style="font-size:18px;font-weight:800">🤖 AI가 인정한 답안</h2>
        <span class="count" id="aiCount" style="font-size:13px;color:var(--ink-soft);border:1px solid var(--line);border-radius:99px;padding:3px 12px"></span>
        <button class="refresh" id="aiCheck" style="margin-left:auto;padding:8px 14px">🔌 연결 확인</button>
        <button class="refresh" id="aiToggle" style="padding:8px 14px">펼치기</button>
      </div>
      <div id="aiStatus" class="hidden" style="border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:14px;line-height:1.6"></div>
      <p class="note">AI가 "같은 뜻"이라고 판정해 <b>모든 학생</b>에게 적용된 답안입니다. 잘못된 것이 있으면 지워 주세요.</p>
      <div id="aiBody" class="hidden"></div>
    </div>
  </section>

  <!-- DETAIL -->
  <section id="screen-detail" class="hidden">
    <span class="back" id="backBtn">← 명단으로</span>
    <div class="panel">
      <div class="detail-head">
        <span class="dn" id="dName"></span>
        <span class="dk" id="dKey"></span>
      </div>
      <div class="seg">
        <button data-tab="fav" class="active" id="tabFav">⭐ 즐겨찾기 <span id="favN"></span></button>
        <button data-tab="wrong" id="tabWrong">🔁 틀린 단어 <span id="wrongN"></span></button>
        <button data-tab="alias" id="tabAlias">✍️ 주관식 인정 답안 <span id="aliasN"></span></button>
      </div>
      <div id="detailBody"></div>
    </div>
  </section>

  <!-- ROSTER -->
  <section id="screen-roster" class="hidden">
    <span class="back" id="rosterBack">← 명단으로</span>
    <h1 class="title">학생 명단 관리</h1>
    <p class="subtitle">여기에 등록된 학생만 학습 사이트에 입장할 수 있습니다.</p>

    <div id="rosterBanner" style="border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:14px;line-height:1.6"></div>

    <div class="panel" style="margin-bottom:16px">
      <div class="bar">
        <input class="search" id="rName" placeholder="이름 (예: 김채현)" style="max-width:200px">
        <input class="search" id="rPhone" placeholder="뒷 4자리" inputmode="numeric" maxlength="4" style="max-width:120px">
        <button class="refresh" id="rAdd" style="background:var(--accent);color:#fff;border-color:var(--accent)">+ 학생 추가</button>
        <button class="refresh" id="rSeed">기존 학습 기록에서 가져오기</button>
      </div>
      <p class="note" id="rMsg" style="margin:0"></p>
    </div>

    <div class="panel">
      <div class="list-head" style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <h2 style="font-size:18px;font-weight:800">등록된 학생</h2>
        <span class="count" id="rCount" style="font-size:13px;color:var(--ink-soft);border:1px solid var(--line);border-radius:99px;padding:3px 12px"></span>
      </div>
      <div id="rosterBody"></div>
    </div>
  </section>

  <footer>능률VOCA 학습 관리 · 학원 내부용</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== Supabase ===== */
const SUPABASE_URL = "https://uxzsleryzpjaoqciyqvs.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV4enNsZXJ5enBqYW9xY2l5cXZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MDc4MDIsImV4cCI6MjA5NzA4MzgwMn0.mt91HfP2DV4Q9gZ_0Ts-B2P6fB3PmQlLJK2XcJeKzL4";
const ADMIN_PIN = "1357";
let sb=null;
try{ sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON); }catch(e){ console.warn(e); }

const $=id=>document.getElementById(id);
const screens=["gate","list","detail","roster"];
function show(n){
  screens.forEach(s=>$("screen-"+s).classList.toggle("hidden",s!==n));
  window.scrollTo(0,0);
  if(n==="gate") $("tools").innerHTML="";   // 잠금 화면에서만 상단 버튼을 감춘다
}

let ALL=[];            // all rows
let STUDENTS=[];       // [{key,name,fav:[],wrong:[],alias:[]}]
let current=null;
const AI_JUDGE_URL="https://uxzsleryzpjaoqciyqvs.supabase.co/functions/v1/judge-meaning";
const ALIAS_OWNER="__ALIAS__";      // 선생님이 승인한 공통 인정 답안 가상 계정
const ALIAS_AI_OWNER="__ALIAS_AI__"; // AI가 인정해 공유된 답안 가상 계정
const GLOBAL=new Set();            // 전체 인정된 word_id
let AI_ROWS=[];                    // AI가 인정한 공유 답안 목록

/* ---- gate ---- */
function tryGate(){
  const v=$("pin").value.trim();
  if(v===ADMIN_PIN){ $("gateMsg").textContent=""; enter(); }
  else{ $("gateMsg").textContent="번호가 올바르지 않습니다."; $("pin").select(); }
}
$("gateBtn").onclick=tryGate;
$("pin").addEventListener("keydown",e=>{if(e.key==="Enter")tryGate();});

async function enter(){
  $("tools").innerHTML='<button id="rosterBtn">👥 명단 관리</button><button id="logout">잠그기</button>';
  $("rosterBtn").onclick=openRoster;
  $("logout").onclick=()=>{ $("pin").value=""; show("gate"); $("pin").focus(); };
  await loadAll();
  show("list");
}

/* ---- load ---- */
async function loadAll(){
  if(!sb){ alert("Supabase 연결에 실패했어요."); return; }
  try{
    const {data,error}=await sb.from("progress")
      .select("student_key,student_name,kind,word_id,word,grp,day,updated_at")
      .order("updated_at",{ascending:false});
    if(error)throw error;
    ALL=data||[];
    groupStudents();
    renderStats();
    renderList();
    renderAiPanel();
  }catch(e){
    console.warn(e);
    $("studentList").innerHTML=`<div class="empty-state"><div class="e-ic">⚠️</div>데이터를 불러오지 못했어요.<br>잠시 후 새로고침해 주세요.</div>`;
  }
}
function groupStudents(){
  const map={};
  GLOBAL.clear();
  AI_ROWS=[];
  ALL.forEach(r=>{
    if(r.student_key===ALIAS_OWNER||r.student_key===ALIAS_AI_OWNER){
      if(r.kind==="alias"){
        GLOBAL.add(r.word_id);
        if(r.student_key===ALIAS_AI_OWNER){
          const seg=String(r.word_id||"").split("|");
          AI_ROWS.push({word_id:r.word_id, answer:r.word||"", eng:seg[2]||"",
                        grp:r.grp||seg[0]||"", day:r.day||seg[1]||"", at:r.updated_at});
        }
      }
      return;                       // 가상 계정은 학생 명단에 넣지 않음
    }
    const k=r.student_key;
    if(!map[k]) map[k]={key:k, name:r.student_name||k, fav:[], wrong:[], alias:[]};
    if(r.kind==="fav") map[k].fav.push({word:r.word, grp:r.grp, day:r.day});
    else if(r.kind==="wrong") map[k].wrong.push({word:r.word, grp:r.grp, day:r.day});
    else if(r.kind==="alias"||r.kind==="alias_req"||r.kind==="alias_ai"){
      const seg=String(r.word_id||"").split("|");   // 그룹|DAY|단어|정규화답
      map[k].alias.push({
        word_id:r.word_id, kind:r.kind, answer:r.word||"",
        eng:seg[2]||"", grp:r.grp||seg[0]||"", day:r.day||seg[1]||""
      });
    }
  });
  STUDENTS=Object.values(map).sort((a,b)=>a.name.localeCompare(b.name,"ko"));
}

/* ---- stats ---- */
function renderStats(){
  const favTot=ALL.filter(r=>r.kind==="fav").length;
  const wrongTot=ALL.filter(r=>r.kind==="wrong").length;
  const aliasTot=ALL.filter(r=>["alias","alias_req","alias_ai"].includes(r.kind)
    && r.student_key!==ALIAS_OWNER && r.student_key!==ALIAS_AI_OWNER).length;
  $("stats").innerHTML=`
    <div class="stat"><div class="n">${STUDENTS.length}</div><div class="l">학생 수</div></div>
    <div class="stat"><div class="n">${favTot}</div><div class="l">즐겨찾기 단어 (전체)</div></div>
    <div class="stat"><div class="n">${wrongTot}</div><div class="l">틀린 단어 (전체)</div></div>
    <div class="stat"><div class="n">${aliasTot}</div><div class="l">주관식 인정 답안</div></div>`;
}

/* ---- list ---- */
function renderList(){
  const q=($("search").value||"").trim().toLowerCase();
  const box=$("studentList"); box.innerHTML="";
  const rows=STUDENTS.filter(s=>s.name.toLowerCase().includes(q));
  if(rows.length===0){
    box.innerHTML=`<div class="empty-state"><div class="e-ic">📭</div>${ALL.length===0?"아직 학습 기록이 없어요.<br>학생이 로그인해 별표하거나 퀴즈를 풀면 여기에 표시됩니다.":"검색 결과가 없습니다."}</div>`;
    return;
  }
  rows.forEach(s=>{
    const b=document.createElement("button"); b.className="srow";
    const favP = s.fav.length ? `<span class="pill fav">⭐ ${s.fav.length}</span>` : `<span class="pill zero">⭐ 0</span>`;
    const wrP  = s.wrong.length ? `<span class="pill wrong">🔁 ${s.wrong.length}</span>` : `<span class="pill zero">🔁 0</span>`;
    const alP = s.alias.length ? `<span class="pill" style="background:#e6f0ff;color:#2b5fa8">✍️ ${s.alias.length}</span>` : "";
    b.innerHTML=`<span class="nm">${esc(s.name)}</span><span class="kk">${esc(s.key)}</span>
      <span class="pills">${favP}${wrP}${alP}</span><span class="chev">›</span>`;
    b.onclick=()=>openDetail(s);
    box.appendChild(b);
  });
}
$("search").addEventListener("input",renderList);
$("refresh").onclick=loadAll;

/* ---- AI 인정 답안 패널 ---- */
let aiOpen=false;
function renderAiPanel(){
  $("aiCount").textContent=`${AI_ROWS.length}개`;
  const body=$("aiBody");
  body.classList.toggle("hidden",!aiOpen);
  $("aiToggle").textContent=aiOpen?"접기":"펼치기";
  if(!aiOpen)return;
  body.innerHTML="";
  if(AI_ROWS.length===0){
    body.innerHTML=`<div class="empty-state"><div class="e-ic">🤖</div>AI가 인정한 답안이 아직 없어요.</div>`;
    return;
  }
  AI_ROWS.slice().sort((a,b)=>(a.grp||"").localeCompare(b.grp||"","ko")||(+a.day||0)-(+b.day||0))
   .forEach(e=>{
    const r=document.createElement("div"); r.className="arow";
    const where=e.grp?`${esc(e.grp)}${e.day?" · DAY "+esc(e.day):""}`:"";
    r.innerHTML=`<span class="aw">${esc(e.eng)}</span>
      <span class="aa">${esc(e.answer)} ${where?`<small>${where}</small>`:""}</span>
      <span class="tag glob">AI 인정</span>`;
    const del=document.createElement("button"); del.className="abtn"; del.textContent="지우기";
    del.onclick=async()=>{
      del.disabled=true;
      const ok=await deleteShared(ALIAS_AI_OWNER,e.word_id);
      if(ok){ AI_ROWS=AI_ROWS.filter(x=>x.word_id!==e.word_id); GLOBAL.delete(e.word_id); renderAiPanel(); }
      else { alert("지우지 못했어요. 잠시 후 다시 시도해 주세요."); del.disabled=false; }
    };
    r.appendChild(del); body.appendChild(r);
  });
}
$("aiToggle").onclick=()=>{ aiOpen=!aiOpen; renderAiPanel(); };

/* ---- AI 채점 연결 확인 ---- */
function aiStatus(kind,html){
  const box=$("aiStatus");
  box.classList.remove("hidden");
  const c = kind==="ok" ? ["var(--accent)","var(--accent-soft)"]
          : kind==="no" ? ["var(--wrong)","var(--wrong-soft)"]
          : ["var(--gold)","#fbf4e4"];
  box.style.border="1px solid "+c[0];
  box.style.background=c[1];
  box.innerHTML=html;
}
$("aiCheck").onclick=async()=>{
  const btn=$("aiCheck"); btn.disabled=true; const label=btn.textContent; btn.textContent="확인 중…";
  aiStatus("wait","함수를 부르는 중입니다…");
  try{
    const r=await fetch(AI_JUDGE_URL+"?selftest=1",{
      headers:{ "Authorization":"Bearer "+SUPABASE_ANON, "apikey":SUPABASE_ANON }
    });
    const d=await r.json().catch(()=>({}));
    if(d.ok){
      aiStatus("ok",`<b>✓ AI 채점이 정상 동작합니다.</b><br>
        키 종류: ${esc(d.keyType||"-")} · 모델: ${esc(d.model||"-")} · 인증: ${esc(d.auth||"-")}<br>
        시험 채점: "subsequently" 에 <b>"추후에"</b> → <b>${esc(d.sample?.verdict||"-")}</b>
        ${d.sample?.reason?`(${esc(d.sample.reason)})`:""}`);
    }else if(r.status===404){
      aiStatus("no","<b>✗ 함수를 찾을 수 없습니다.</b><br>Supabase 대시보드 → Edge Functions 에서 <b>judge-meaning</b> 함수를 배포했는지 확인해 주세요.");
    }else{
      const detail=String(d.detail||d.error||("HTTP "+r.status));
      const hint = /ACCESS_TOKEN_TYPE_UNSUPPORTED|401|403/.test(detail)
        ? "<br>→ 이 키로는 Gemini API 를 쓸 수 없습니다. AI Studio 에서 키를 다시 발급해 보세요."
        : /GEMINI_API_KEY/.test(detail)
        ? "<br>→ Edge Functions → Secrets 에 <b>GEMINI_API_KEY</b> 를 등록해 주세요."
        : "";
      aiStatus("no",`<b>✗ 호출에 실패했습니다.</b><br><span style="font-family:ui-monospace,monospace;font-size:12px">${esc(detail).slice(0,300)}</span>${hint}`);
    }
  }catch(e){
    aiStatus("no","<b>✗ 함수에 연결하지 못했습니다.</b><br>주소가 맞는지, 함수가 배포되었는지 확인해 주세요.");
  }
  btn.disabled=false; btn.textContent=label;
};
async function deleteShared(owner,wordId){
  if(!sb)return false;
  try{
    const {error}=await sb.from("progress").delete()
      .eq("student_key",owner).eq("kind","alias").eq("word_id",wordId);
    if(error)throw error;
    return true;
  }catch(err){ console.warn(err); return false; }
}

/* ---- detail ---- */
let activeTab="fav";
function openDetail(s){
  current=s; activeTab="fav";
  $("dName").textContent=s.name;
  $("dKey").textContent=s.key;
  $("favN").textContent=`(${s.fav.length})`;
  $("wrongN").textContent=`(${s.wrong.length})`;
  $("aliasN").textContent=`(${s.alias.length})`;
  setTab("fav");
  show("detail");
}
function setTab(t){
  activeTab=t;
  $("tabFav").classList.toggle("active",t==="fav");
  $("tabWrong").classList.toggle("active",t==="wrong");
  $("tabAlias").classList.toggle("active",t==="alias");
  if(t==="alias"){ renderAlias(); return; }
  const arr = t==="fav" ? current.fav : current.wrong;
  const body=$("detailBody"); body.innerHTML="";
  if(arr.length===0){
    body.innerHTML=`<div class="empty-state"><div class="e-ic">${t==="fav"?"⭐":"🔁"}</div>${t==="fav"?"즐겨찾기한 단어가 없어요.":"틀린 단어가 없어요."}</div>`;
    return;
  }
  // sort by group then day
  arr.slice().sort((a,b)=>(a.grp||"").localeCompare(b.grp||"","ko")|| (+a.day||0)-(+b.day||0))
    .forEach(e=>{
      const r=document.createElement("div"); r.className="vrow";
      const tag = e.grp ? `${e.grp}${e.day?" · DAY "+e.day:""}` : "";
      r.innerHTML=`<span class="vw">${esc(e.word||"")}</span>${tag?`<span class="vg">${esc(tag)}</span>`:""}<span class="vm"></span>`;
      body.appendChild(r);
    });
}
/* ---- 주관식 인정 답안 ---- */
function renderAlias(){
  const body=$("detailBody"); body.innerHTML="";
  const arr=current.alias;
  if(arr.length===0){
    body.innerHTML=`<div class="empty-state"><div class="e-ic">✍️</div>주관식 퀴즈에서 인정하거나 요청한 답안이 없어요.</div>`;
    return;
  }
  const note=document.createElement("p"); note.className="note";
  note.innerHTML=`<b>스스로 인정</b>은 학생이 "비슷한 뜻"이라고 판단해 정답 처리한 답, <b>AI 인정</b>은 AI가 같은 뜻이라고 판정한 답,
    <b>인정 요청</b>은 오답 처리된 뒤 인정해 달라고 보낸 답입니다.<br>
    <b>[전체 인정]</b>을 누르면 그 답이 <b>모든 학생</b>에게 정답으로 인정됩니다.`;
  body.appendChild(note);

  arr.slice().sort((a,b)=>(a.grp||"").localeCompare(b.grp||"","ko")||(+a.day||0)-(+b.day||0))
    .forEach(e=>{
      const r=document.createElement("div"); r.className="arow";
      const tag = e.kind==="alias" ? `<span class="tag self">스스로 인정</span>`
                : e.kind==="alias_ai" ? `<span class="tag glob">AI 인정</span>`
                : `<span class="tag req">인정 요청</span>`;
      const where = e.grp ? `${esc(e.grp)}${e.day?" · DAY "+esc(e.day):""}` : "";
      r.innerHTML=`<span class="aw">${esc(e.eng)}</span>
        <span class="aa">${esc(e.answer)} ${where?`<small>${where}</small>`:""}</span>${tag}`;
      const btn=document.createElement("button");
      btn.className="abtn";
      const paint=()=>{
        const on=GLOBAL.has(e.word_id);
        btn.classList.toggle("on",on);
        btn.textContent = on ? "✓ 전체 인정됨 (취소)" : "전체 인정";
      };
      paint();
      btn.onclick=async()=>{
        btn.disabled=true;
        const on=GLOBAL.has(e.word_id);
        const ok = on ? await revokeGlobal(e) : await approveGlobal(e);
        if(ok){ if(on) GLOBAL.delete(e.word_id); else GLOBAL.add(e.word_id); }
        else alert("저장하지 못했어요. 잠시 후 다시 시도해 주세요.");
        btn.disabled=false; paint();
      };
      r.appendChild(btn);
      body.appendChild(r);
    });
}
async function approveGlobal(e){
  if(!sb)return false;
  try{
    const {error}=await sb.from("progress").upsert({
      student_key:ALIAS_OWNER, student_name:"(공통 인정 답안)",
      kind:"alias", word_id:e.word_id, word:e.answer,
      grp:e.grp, day:e.day, updated_at:new Date().toISOString()
    },{onConflict:"student_key,kind,word_id"});
    if(error)throw error;
    return true;
  }catch(err){ console.warn(err); return false; }
}
async function revokeGlobal(e){ return deleteShared(ALIAS_OWNER,e.word_id); }

document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$("backBtn").onclick=()=>{ renderList(); show("list"); };

/* ---- 학생 명단 관리 ---- */
let ROSTER=[];
async function openRoster(){ await loadRoster(); show("roster"); }
$("rosterBack").onclick=()=>show("list");

async function loadRoster(){
  if(!sb)return;
  try{
    const {data,error}=await sb.rpc("roster_list");
    if(error)throw error;
    ROSTER=data||[];
  }catch(e){ console.warn(e); ROSTER=[]; $("rMsg").textContent="명단을 불러오지 못했어요."; }
  renderRoster();
}
function renderRoster(){
  $("rCount").textContent=`${ROSTER.length}명`;
  const b=$("rosterBanner");
  if(ROSTER.length===0){
    b.style.border="1px solid var(--gold)"; b.style.background="#fbf4e4";
    b.innerHTML="<b>⚠ 지금은 누구나 입장할 수 있습니다.</b><br>명단이 비어 있어서 아무 이름이나 넣어도 들어가집니다. 학생을 <b>한 명이라도 추가하면</b> 그때부터 명단에 있는 학생만 입장할 수 있습니다.";
  }else{
    b.style.border="1px solid var(--accent)"; b.style.background="var(--accent-soft)";
    b.innerHTML=`<b>✓ 명단 확인이 켜져 있습니다.</b><br>등록된 ${ROSTER.length}명만 입장할 수 있고, 이름이나 번호가 다르면 막힙니다.`;
  }
  const body=$("rosterBody"); body.innerHTML="";
  if(ROSTER.length===0){
    body.innerHTML=`<div class="empty-state"><div class="e-ic">👥</div>등록된 학생이 없어요.<br>위에서 추가하거나 [기존 학습 기록에서 가져오기] 를 눌러 보세요.</div>`;
    return;
  }
  ROSTER.forEach(st=>{
    const r=document.createElement("div"); r.className="arow";
    r.innerHTML=`<span class="aw">${esc(st.name)}</span>
      <span class="aa">뒷 4자리 <b>${esc(st.phone4)}</b>
        ${st.note?`<small>${esc(st.note)}</small>`:""}</span>`;
    const del=document.createElement("button"); del.className="abtn"; del.textContent="삭제";
    del.onclick=async()=>{
      if(!confirm(`${st.name} 학생을 명단에서 지울까요?\n(학습 기록은 그대로 남고, 입장만 막힙니다)`))return;
      del.disabled=true;
      try{
        const {error}=await sb.rpc("roster_remove",{p_key:st.student_key});
        if(error)throw error;
        await loadRoster();
      }catch(e){ console.warn(e); alert("삭제하지 못했어요."); del.disabled=false; }
    };
    r.appendChild(del); body.appendChild(r);
  });
}
$("rAdd").onclick=async()=>{
  const name=$("rName").value.trim(), phone=$("rPhone").value.trim();
  const msg=$("rMsg"); msg.style.color="var(--wrong)";
  if(!name){ msg.textContent="이름을 입력해 주세요."; return; }
  if(!/^\d{4}$/.test(phone)){ msg.textContent="뒷 4자리를 숫자로 입력해 주세요."; return; }
  const btn=$("rAdd"); btn.disabled=true;
  try{
    const {error}=await sb.rpc("roster_add",{p_name:name,p_phone:phone,p_note:null});
    if(error)throw error;
    $("rName").value=""; $("rPhone").value=""; $("rName").focus();
    msg.style.color="var(--accent)"; msg.textContent=`${name} 학생을 추가했어요.`;
    await loadRoster();
  }catch(e){ console.warn(e); msg.textContent="추가하지 못했어요."; }
  btn.disabled=false;
};
$("rPhone").addEventListener("keydown",e=>{ if(e.key==="Enter")$("rAdd").click(); });
$("rName").addEventListener("keydown",e=>{ if(e.key==="Enter")$("rPhone").focus(); });
$("rSeed").onclick=async()=>{
  if(!confirm("이미 학습 기록이 있는 학생들을 명단에 넣습니다.\n지금 명단이 비어 있다면, 이 작업 이후로는 명단에 있는 학생만 입장할 수 있게 됩니다. 계속할까요?"))return;
  const btn=$("rSeed"); btn.disabled=true;
  try{
    const {data,error}=await sb.rpc("roster_seed_from_progress");
    if(error)throw error;
    $("rMsg").style.color="var(--accent)";
    $("rMsg").textContent=`${data??0}명을 명단에 추가했어요.`;
    await loadRoster();
  }catch(e){ console.warn(e); $("rMsg").style.color="var(--wrong)"; $("rMsg").textContent="가져오지 못했어요."; }
  btn.disabled=false;
};

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}

/* ---- init ---- */
show("gate");
$("pin").focus();
</script>
</body>
